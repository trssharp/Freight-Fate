name: Workflow checks

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'tools/select_nightly_branch.py'
      - 'tests/test_select_nightly_branch.py'
      - 'tests/test_ci_workflow.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/select_nightly_branch.py'
      - 'tests/test_select_nightly_branch.py'
      - 'tests/test_ci_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run pytest tests/test_select_nightly_branch.py tests/test_ci_workflow.py
