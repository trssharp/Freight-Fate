name: Windows runtime packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test runtime packaging
        run: python -m unittest discover -s tests -p test_windows_runtime.py -v
      - name: Stage and audit the installed Visual Studio runtime
        shell: python
        run: |
          import tempfile
          from pathlib import Path
          from windows_runtime import stage_windows_runtime
          with tempfile.TemporaryDirectory() as directory:
              stage_windows_runtime(Path(directory))
